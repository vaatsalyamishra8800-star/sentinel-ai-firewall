AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sentinel - AI Agent Security Firewall & Tool Interceptor
  Catalyst Hack 2026 - Team Arjun
  Ingress: API Gateway | Inspection: AWS Lambda | Audit: DynamoDB | Defense: Bedrock LLM Guard

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment stage name (prod, dev, staging)
  BedrockEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable Amazon Bedrock LLM semantic prompt injection checking

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.11

Resources:
  # ========================================================
  # 1. API Gateway REST API
  # ========================================================
  SentinelApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Cors:
        AllowMethods: "'POST, GET, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization, X-Requested-With'"
        AllowOrigin: "'*'"
      EndpointConfiguration: REGIONAL

  # ========================================================
  # 2. DynamoDB Audit Trail Table
  # ========================================================
  SentinelAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-audit-events-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: Sentinel
        - Key: Team
          Value: Team Arjun

  # ========================================================
  # 3. Sentinel Inspection Lambda Function
  # ========================================================
  SentinelFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-firewall-${EnvironmentName}
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Description: Core Sentinel inspection engine and policy enforcement for AI agents
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref SentinelAuditTable
          BEDROCK_ENABLED: !Ref BedrockEnabled
      Policies:
        # Least privilege: CRUD on Sentinel DynamoDB table
        - DynamoDBCrudPolicy:
            TableName: !Ref SentinelAuditTable
        # CloudWatch basic execution is automatically attached by AWS::Serverless::Function
        # Optional Amazon Bedrock InvokeModel permissions
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        # POST /inspect - Primary gateway inspection endpoint
        InspectEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /inspect
            Method: POST
        # GET /health - Service health check
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /health
            Method: GET
        # GET /events - Audit log queries for dashboard
        EventsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /events
            Method: GET

Outputs:
  SentinelApiUrl:
    Description: Base API Gateway URL
    Value: !Sub "https://${SentinelApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
  InspectEndpoint:
    Description: Sentinel Inspection Endpoint (POST)
    Value: !Sub "https://${SentinelApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/inspect"
  HealthEndpoint:
    Description: Health Check Endpoint (GET)
    Value: !Sub "https://${SentinelApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/health"
  EventsEndpoint:
    Description: Audit Trail Events Endpoint (GET)
    Value: !Sub "https://${SentinelApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/events"
  AuditTableName:
    Description: DynamoDB Table Name for Security Events
    Value: !Ref SentinelAuditTable
